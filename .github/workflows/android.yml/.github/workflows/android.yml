
name: Build OpenCheps APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q opencheps-main.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle
        working-directory: opencheps-main
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Download Stockfish
        working-directory: opencheps-main
        run: |
          set -e
          mkdir -p sf-cache
          curl -fL -o sf-cache/arm64.tar \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar
          tar xf sf-cache/arm64.tar -C sf-cache
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp sf-cache/stockfish/stockfish-android-armv8 \
            app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Build 64-bit APK
        working-directory: opencheps-main
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: opencheps-arm64-apk
          path: opencheps-main/app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
